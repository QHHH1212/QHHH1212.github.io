<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>像素猫猫备选 · 挑选样式</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pink: #ff8ec8;
      --pink-hot: #ff4fa3;
      --mint: #7ef0d8;
      --ink: #3a1a2e;
      --ink-soft: #6b3a55;
      --bg: #fff5fb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "ZCOOL KuaiLe", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 20% 0%, #ffd0e8, transparent 55%),
        radial-gradient(ellipse 60% 40% at 90% 10%, #c9f7ff, transparent 50%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 1.5rem 1rem 3rem;
    }
    .wrap { max-width: 980px; margin: 0 auto; }
    header {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    header .tag {
      font-family: "Press Start 2P", monospace;
      font-size: 0.45rem;
      color: var(--pink-hot);
      letter-spacing: 0.12em;
      margin-bottom: 0.6rem;
    }
    header h1 {
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 400;
    }
    header p {
      margin-top: 0.45rem;
      color: var(--ink-soft);
      font-size: 1rem;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin: 1rem 0 1.5rem;
    }
    .toolbar button {
      font-family: "ZCOOL KuaiLe", cursive;
      font-size: 0.95rem;
      border: 2px solid var(--ink);
      background: #fff;
      padding: 0.35rem 0.75rem;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--ink);
    }
    .toolbar button.active {
      background: var(--pink);
      color: #fff;
    }
    .toolbar button:hover { background: #ffe0f0; }
    .toolbar button.active:hover { background: var(--pink-hot); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }

    .card {
      border: 3px solid var(--ink);
      background: #fff;
      box-shadow: 4px 4px 0 rgba(255, 79, 163, 0.25);
      padding: 1rem 0.75rem 0.9rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      position: relative;
    }
    .card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 rgba(255, 79, 163, 0.35);
    }
    .card.picked {
      outline: 3px solid var(--pink-hot);
      outline-offset: 2px;
      background: #fff0f7;
    }
    .card .num {
      position: absolute;
      top: 0.4rem;
      left: 0.5rem;
      font-family: "Press Start 2P", monospace;
      font-size: 0.4rem;
      color: var(--pink-hot);
    }
    .stage {
      height: 140px;
      display: grid;
      place-items: center;
      background:
        linear-gradient(180deg, #ffeaf5 0%, #fff 70%);
      border: 2px dashed rgba(255, 142, 200, 0.5);
      margin-bottom: 0.65rem;
      image-rendering: pixelated;
    }
    .stage svg {
      width: 96px;
      height: 96px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      shape-rendering: crispEdges;
    }
    .stage.big svg {
      width: 112px;
      height: 112px;
    }
    .card h2 {
      font-size: 1.1rem;
      font-weight: 400;
      margin-bottom: 0.2rem;
    }
    .card .desc {
      font-size: 0.85rem;
      color: var(--ink-soft);
      line-height: 1.35;
    }
    .card .pick-hint {
      margin-top: 0.45rem;
      font-size: 0.8rem;
      color: var(--pink-hot);
      min-height: 1.1em;
    }

    .picked-bar {
      position: sticky;
      bottom: 0.75rem;
      margin-top: 1.5rem;
      border: 3px solid var(--ink);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(6px);
      padding: 0.85rem 1rem;
      box-shadow: 4px 4px 0 var(--ink);
      text-align: center;
      z-index: 10;
    }
    .picked-bar strong { color: var(--pink-hot); }
    .picked-bar .list {
      margin-top: 0.35rem;
      font-size: 0.95rem;
      color: var(--ink-soft);
      word-break: break-all;
    }
    .picked-bar button {
      margin-top: 0.55rem;
      font-family: "ZCOOL KuaiLe", cursive;
      font-size: 0.95rem;
      border: 2px solid var(--ink);
      background: linear-gradient(180deg, #fff, #ffd6ec);
      padding: 0.35rem 0.9rem;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--ink);
    }

    footer {
      text-align: center;
      margin-top: 1.5rem;
      font-family: "Press Start 2P", monospace;
      font-size: 0.38rem;
      color: var(--ink-soft);
      letter-spacing: 0.08em;
    }

    /* idle bob for preview */
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .card:hover .stage svg { animation: bob 0.9s ease-in-out infinite; }
  </style>
</head>
<body>

      <button type="button" id="clearPick">清空选择</button>
    </div>

    <div class="grid" id="grid">
      <!-- cards injected -->
    </div>

    <div class="picked-bar" id="pickedBar">

      <button type="button" id="copyPick">复制选择结果</button>
    </div>

    <footer>FOR 陆陆 BIRTHDAY · CAT STYLE PICKER</footer>
  </div>

  <script>
    var CATS = [
      { id: "a1",  name: "蜜桃虎斑",   desc: "正坐微笑 · 腮红软爪",     vibe: "日常主角" },
      { id: "a2",  name: "草莓牛奶",   desc: "躺平伸爪 · 粉白配色",     vibe: "超软萌" },
      { id: "a3",  name: "窗台值班",   desc: "百叶窗偷窥 · 朋友圈梗",   vibe: "梗向" },
      { id: "a4",  name: "圈圈委屈",   desc: "伊丽莎白圈 · 泪光点",     vibe: "梗向" },
      { id: "a5",  name: "被窝贵人",   desc: "钻被探头 · 祺贵人",       vibe: "梗向" },
      { id: "a6",  name: "中秋月猫",   desc: "抱月饼 · 淡紫色毛",       vibe: "节日" },
      { id: "a7",  name: "面包团子",   desc: "圆滚滚极简 · 很耐看",     vibe: "招牌" },
      { id: "a8",  name: "蝴蝶结公主", desc: "粉裙蝴蝶结 · 少女",       vibe: "少女" },
      { id: "a9",  name: "赛博墨镜",   desc: "蒸汽波墨镜 · 粉青反光",   vibe: "主题" },
      { id: "a10", name: "小灰招手",   desc: "灰虎斑招手 · 像真猫",     vibe: "写实萌" },
      { id: "a11", name: "睡着了",     desc: "蜷睡 zzz · 尾巴盖鼻",     vibe: "安静" },
      { id: "a12", name: "飞扑爱心",   desc: "张开爪子扑过来",         vibe: "互动" }
    ];

    var picked = new Set();
    var grid = document.getElementById("grid");

    CATS.forEach(function (cat, i) {
      var n = i + 1;
      var card = document.createElement("article");
      card.className = "card";
      card.dataset.id = cat.id;
      card.innerHTML =
        '<span class="num">#' + String(n).padStart(2, "0") + "</span>" +
        '<div class="stage">' +
          '<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><use href="#' + cat.id + '"/></svg>' +
        "</div>" +
        "<h2>" + cat.name + "</h2>" +
        '<p class="desc">' + cat.desc + "<br/>" + cat.vibe + "</p>" +
        '<p class="pick-hint"></p>';
      card.addEventListener("click", function () {
        if (picked.has(cat.id)) {
          picked.delete(cat.id);
          card.classList.remove("picked");
          card.querySelector(".pick-hint").textContent = "";
        } else {
          picked.add(cat.id);
          card.classList.add("picked");
          card.querySelector(".pick-hint").textContent = "已选 ✓";
        }
        renderPicked();
      });
      grid.appendChild(card);
    });

    function renderPicked() {
      var count = picked.size;
      document.getElementById("pickedCount").textContent = String(count);
      if (!count) {
        document.getElementById("pickedList").textContent = "还没选哦，点卡片即可";
        return;
      }
      var labels = CATS.filter(function (c) { return picked.has(c.id); })
        .map(function (c, idx) {
          var n = CATS.indexOf(c) + 1;
          return "#" + String(n).padStart(2, "0") + " " + c.name;
        });
      document.getElementById("pickedList").textContent = labels.join(" · ");
    }

    document.querySelectorAll(".toolbar button[data-size]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".toolbar button[data-size]").forEach(function (b) {
          b.classList.remove("active");
        });
        btn.classList.add("active");
        var big = btn.dataset.size === "big";
        document.querySelectorAll(".stage").forEach(function (s) {
          s.classList.toggle("big", big);
        });
      });
    });

    document.getElementById("clearPick").addEventListener("click", function () {
      picked.clear();
      document.querySelectorAll(".card").forEach(function (c) {
        c.classList.remove("picked");
        c.querySelector(".pick-hint").textContent = "";
      });
      renderPicked();
    });

    document.getElementById("copyPick").addEventListener("click", function () {
      var text = document.getElementById("pickedList").textContent;
      if (!picked.size) {
        alert("还没选猫猫哦");
        return;
      }
      var payload = "我想要的像素猫：" + text;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(payload).then(function () {
          alert("已复制：\n" + payload);
        });
      } else {
        prompt("复制下面内容发给我：", payload);
      }
    });
  </script>
